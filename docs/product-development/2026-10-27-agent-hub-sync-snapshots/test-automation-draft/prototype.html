<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Codex Buddy - Agent Hub 交互原型模拟器</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #09090b; color: #f4f4f5; padding: 30px; display: flex; flex-direction: column; align-items: center; }
    .device { width: 340px; height: 160px; background: #18181b; border: 4px solid #3f3f46; border-radius: 18px; padding: 12px; display: flex; gap: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .pet-pane { width: 120px; height: 100%; background: #27272a; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .pet-emoji { font-size: 48px; }
    .pet-name { font-size: 11px; color: #a1a1aa; margin-top: 4px; font-weight: 600; }
    .data-pane { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .top-bar { display: flex; justify-content: space-between; font-size: 11px; font-family: monospace; }
    .agent-tag { background: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .bars { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: 10px; color: #71717a; }
    .bar-bg { width: 100%; height: 8px; background: #3f3f46; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: #10b981; border-radius: 4px; }
    .controls { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
    button { background: #27272a; border: 1px solid #3f3f46; color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #3f3f46; }
  </style>
</head>
<body>
  <h2>StickS3 硬件屏幕实时模拟原型</h2>
  <div class="device">
    <div class="pet-pane">
      <div class="pet-emoji" id="pet">🤖</div>
      <div class="pet-name" id="agent-name">Codex CLI</div>
    </div>
    <div class="data-pane">
      <div class="top-bar">
        <span class="agent-tag" id="status-tag">BUSY</span>
        <span style="color:#10b981;">Hub: <strong id="hub-count">3</strong>/3</span>
      </div>
      <div class="bars">
        <div class="bar-label"><span>5h 窗口</span><span id="p-text">42%</span></div>
        <div class="bar-bg"><div class="bar-fill" id="p-bar" style="width: 42%;"></div></div>
        <div class="bar-label"><span>7d 窗口</span><span id="s-text">68%</span></div>
        <div class="bar-bg"><div class="bar-fill" id="s-bar" style="width: 68%;"></div></div>
      </div>
      <div style="font-size:9px; color:#52525b; text-align:right;">BLE: Connected</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="setAgent('Codex CLI', '🤖', 'BUSY', '#3b82f6', 42, 68)">切换 Codex (工作态)</button>
    <button onclick="setAgent('Claude Code', '🐱', 'IDLE', '#10b981', 15, 30)">切换 Claude (空闲态)</button>
    <button onclick="setAgent('Cursor', '⚡', 'ATTN', '#f59e0b', 85, 92)">切换 Cursor (需要关注)</button>
  </div>

  <script>
    function setAgent(name, emoji, status, color, p, s) {
      document.getElementById('agent-name').innerText = name;
      document.getElementById('pet').innerText = emoji;
      const tag = document.getElementById('status-tag');
      tag.innerText = status;
      tag.style.background = color;
      document.getElementById('p-text').innerText = p + '%';
      document.getElementById('p-bar').style.width = p + '%';
      document.getElementById('s-text').innerText = s + '%';
      document.getElementById('s-bar').style.width = s + '%';
    }
  </script>
</body>
</html>
